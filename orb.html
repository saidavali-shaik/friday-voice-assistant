<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Friday</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --cyan: #00e5ff;
  --cyan2: #00bcd4;
  --teal: #5fffdc;
  --glow: rgba(0,229,255,0.18);
  --bg: #000;
}

body {
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  color: var(--cyan);
}

/* ── Scanlines ── */
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.13) 3px,
    rgba(0,0,0,0.13) 4px
  );
}

/* ── Interface grid ── */
.interface-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background-image:
    linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* ── Shell ── */
.jarvis-shell {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

/* ── HUD Dials ── */
.hud-dial {
  position: absolute;
  width: 72px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hud-top-left  { top: 28px; left: 28px; }
.hud-top-right { top: 28px; right: 28px; }
.hud-bottom-right { bottom: 120px; right: 28px; }

.hud-dial-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.3);
  animation: hud-spin 8s linear infinite;
}
.hud-top-right .hud-dial-ring { animation-direction: reverse; animation-duration: 5s; }
.hud-bottom-right .hud-dial-ring { animation-duration: 11s; }

.hud-dial-core {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.5);
  position: relative;
}
.hud-dial-radar::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 10px; height: 1px;
  background: rgba(0,229,255,0.7);
  transform-origin: left center;
  animation: hud-spin 2s linear infinite;
}
.hud-dial-target::before,
.hud-dial-target::after {
  content: '';
  position: absolute;
  background: rgba(0,229,255,0.5);
}
.hud-dial-target::before { width: 1px; height: 100%; left: 50%; top: 0; }
.hud-dial-target::after  { width: 100%; height: 1px; top: 50%; left: 0; }

.hud-dial-meter::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  height: 40%;
  background: rgba(0,229,255,0.15);
  animation: meter-pulse 2s ease-in-out infinite;
}

.hud-dial-tick {
  position: absolute;
  background: rgba(0,229,255,0.4);
}
.hud-dial-tick-a { width: 8px; height: 1px; top: 0; left: 50%; transform: translateX(-50%); }
.hud-dial-tick-b { width: 1px; height: 8px; right: 0; top: 50%; transform: translateY(-50%); }

@keyframes hud-spin { to { transform: rotate(360deg); } }
@keyframes meter-pulse { 0%,100%{height:20%} 50%{height:70%} }

/* ── Orb Stage ── */
.orb-stage {
  position: relative;
  width: 340px;
  height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Rings ── */
.orb-ring {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  transition: border-color 0.5s, box-shadow 0.5s;
}
.orb-ring-primary {
  inset: -8px;
  border: 1px solid rgba(0,220,255,0.2);
}
.orb-ring-secondary {
  inset: -22px;
  border: 1px solid rgba(0,220,255,0.08);
}
.mode-listening .orb-ring-primary {
  border-color: rgba(0,229,255,0.5);
  box-shadow: 0 0 28px rgba(0,229,255,0.2), inset 0 0 28px rgba(0,229,255,0.05);
}
.mode-responding .orb-ring-primary {
  border-color: rgba(95,255,220,0.5);
  box-shadow: 0 0 36px rgba(95,255,220,0.25), inset 0 0 20px rgba(95,255,220,0.06);
}
.mode-listening .orb-ring-secondary  { border-color: rgba(0,229,255,0.15); }
.mode-responding .orb-ring-secondary { border-color: rgba(95,255,220,0.12); }

/* ── Reticle marks ── */
.orb-reticle {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.reticle-mark {
  position: absolute;
  background: rgba(0,229,255,0.35);
}
.reticle-top    { width: 1px; height: 14px; top: 0;    left: 50%; }
.reticle-bottom { width: 1px; height: 14px; bottom: 0; left: 50%; }
.reticle-left   { width: 14px; height: 1px; left: 0;   top: 50%; }
.reticle-right  { width: 14px; height: 1px; right: 0;  top: 50%; }

/* ── Canvas ── */
canvas {
  display: block;
  width: 340px;
  height: 340px;
}

/* ── Status ── */
.status-block {
  margin-top: 32px;
  text-align: center;
  letter-spacing: 0.25em;
}
.status-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 12px;
  color: var(--cyan);
  opacity: 0.85;
  transition: color 0.4s;
}
.status-dash {
  display: inline-block;
  width: 28px;
  height: 1px;
  background: currentColor;
  opacity: 0.4;
}
.mode-responding .status-line { color: var(--teal); }
.status-code {
  font-size: 9px;
  color: rgba(0,229,255,0.3);
  margin-top: 6px;
  letter-spacing: 0.2em;
}

/* ── Control deck ── */
.control-deck {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* ── Waveform ── */
.waveform {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 28px;
}
.waveform span {
  display: inline-block;
  width: 3px;
  border-radius: 2px;
  background: rgba(0,229,255,0.25);
  height: 4px;
  transition: background 0.3s;
}
.waveform-listening span,
.waveform-responding span {
  background: rgba(0,229,255,0.6);
  animation: wave-bar 0.7s ease-in-out infinite alternate;
  animation-delay: calc(var(--bar-index) * 0.04s);
}
.waveform-responding span {
  background: rgba(95,255,220,0.7);
  animation-duration: 0.4s;
}
@keyframes wave-bar {
  from { height: 3px; }
  to   { height: 22px; }
}

/* ── Buttons ── */
.mode-switcher {
  display: flex;
  gap: 12px;
}
.mode-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px solid rgba(0,220,255,0.25);
  color: rgba(0,220,255,0.45);
  padding: 7px 18px;
  border-radius: 3px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  transition: all 0.3s;
}
.mode-btn:hover {
  border-color: rgba(0,220,255,0.5);
  color: rgba(0,220,255,0.8);
}
.mode-btn.active {
  background: rgba(0,220,255,0.1);
  border-color: var(--cyan);
  color: var(--cyan);
}
.button-node {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.6;
}
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="interface-grid"></div>

<div class="jarvis-shell" id="shell">

  <!-- HUD dials -->
  <div class="hud-dial hud-top-left">
    <span class="hud-dial-ring"></span>
    <span class="hud-dial-core hud-dial-radar"></span>
    <span class="hud-dial-tick hud-dial-tick-a"></span>
    <span class="hud-dial-tick hud-dial-tick-b"></span>
  </div>
  <div class="hud-dial hud-top-right">
    <span class="hud-dial-ring"></span>
    <span class="hud-dial-core hud-dial-target"></span>
    <span class="hud-dial-tick hud-dial-tick-a"></span>
    <span class="hud-dial-tick hud-dial-tick-b"></span>
  </div>
  <div class="hud-dial hud-bottom-right">
    <span class="hud-dial-ring"></span>
    <span class="hud-dial-core hud-dial-meter"></span>
    <span class="hud-dial-tick hud-dial-tick-a"></span>
    <span class="hud-dial-tick hud-dial-tick-b"></span>
  </div>

  <!-- Orb -->
  <section class="orb-stage" aria-label="JARVIS holographic assistant">
    <div class="orb-reticle">
      <span class="reticle-mark reticle-top"></span>
      <span class="reticle-mark reticle-right"></span>
      <span class="reticle-mark reticle-bottom"></span>
      <span class="reticle-mark reticle-left"></span>
    </div>
    <div class="orb-ring orb-ring-primary"></div>
    <div class="orb-ring orb-ring-secondary"></div>
    <canvas id="orb" width="680" height="680" style="width:340px;height:340px;"></canvas>
  </section>

  <!-- Status -->
  <div class="status-block">
    <div class="status-line">
      <span class="status-dash"></span>
      <span id="status-label">FRIDAY · STANDBY</span>
      <span class="status-dash"></span>
    </div>
    <div class="status-code">ONLINE</div>
  </div>

  <!-- Controls -->
  <div class="control-deck">
    <div class="waveform waveform-idle" id="waveform">
      <!-- bars injected by JS -->
    </div>
    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="idle"><span class="button-node"></span>IDLE</button>
      <button class="mode-btn" data-mode="listening"><span class="button-node"></span>LISTENING</button>
      <button class="mode-btn" data-mode="responding"><span class="button-node"></span>RESPONDING</button>
    </div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const PARTICLE_COUNT = 1800;
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

const LABELS = {
  idle: "FRIDAY · STANDBY",
  listening: "FRIDAY · LISTENING...",
  responding: "FRIDAY · RESPONDING",
};

// ── State ──────────────────────────────────────────────────────────────────
let mode = "idle";
const modeTarget = () => mode;

// ── DOM refs ───────────────────────────────────────────────────────────────
const shell       = document.getElementById("shell");
const canvas      = document.getElementById("orb");
const ctx         = canvas.getContext("2d");
const statusLabel = document.getElementById("status-label");
const waveform    = document.getElementById("waveform");

// ── Waveform bars ──────────────────────────────────────────────────────────
for (let i = 0; i < 42; i++) {
  const bar = document.createElement("span");
  bar.style.setProperty("--bar-index", i);
  waveform.appendChild(bar);
}

// ── Buttons ────────────────────────────────────────────────────────────────
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applyUIMode(mode);
  });
});

function applyUIMode(m) {
  shell.className = `jarvis-shell mode-${m}`;
  statusLabel.textContent = LABELS[m];
  waveform.className = `waveform waveform-${m}`;
}

// ── Particles ──────────────────────────────────────────────────────────────
const points = Array.from({ length: PARTICLE_COUNT }, (_, i) => {
  const y = 1 - (i / (PARTICLE_COUNT - 1)) * 2;
  const radial = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = GOLDEN_ANGLE * i;
  return {
    x: Math.cos(theta) * radial,
    y,
    z: Math.sin(theta) * radial,
    latitude: Math.asin(y),
  };
});

// ── Arcs ───────────────────────────────────────────────────────────────────
let arcs = [];
let lastSpark = 0;

function drawArc(arc, now, radius, cx, cy, rotation) {
  const age = (now - arc.born) / 1000;
  if (age > 0.42) return;
  const lon = arc.longitude + rotation;
  const sy = Math.sin(arc.latitude);
  const ring = Math.cos(arc.latitude);
  const sx = Math.cos(lon) * ring;
  const sz = Math.sin(lon) * ring;
  if (sz < -0.3) return;

  const startX = cx + sx * radius;
  const startY = cy + sy * radius;
  const length = radius * (0.2 + arc.seed * 0.16);
  const outward = Math.atan2(startY - cy, startX - cx);
  const alpha = 1 - age / 0.42;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  for (let step = 1; step <= 7; step++) {
    const progress = step / 7;
    const jitter = Math.sin(step * 7.31 + arc.seed * 31) * radius * 0.018 * (1 - progress);
    ctx.lineTo(
      startX + Math.cos(outward) * length * progress + Math.cos(outward + Math.PI / 2) * jitter,
      startY + Math.sin(outward) * length * progress + Math.sin(outward + Math.PI / 2) * jitter,
    );
  }
  ctx.strokeStyle = `rgba(95,255,220,${alpha * 0.82})`;
  ctx.shadowColor = "rgba(38,255,218,0.95)";
  ctx.shadowBlur = 9;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

// ── Render loop ────────────────────────────────────────────────────────────
let rotation = 0;
let stateMix = 0;
let listeningMix = 0;
let lastTime = performance.now();

function render(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const activeMode = modeTarget();
  const transition = 1 - Math.exp(-6.5 * dt);
  stateMix    += ((activeMode === "responding" ? 1 : 0) - stateMix) * transition;
  listeningMix += ((activeMode === "listening"  ? 1 : 0) - listeningMix) * transition;
  rotation += dt * (0.12 + stateMix * 0.3);

  const W = canvas.width  / 2; // logical px (we drew at 2x)
  const H = canvas.height / 2;
  const cx = W / 2, cy = H / 2;
  const baseRadius = Math.min(W, H) * 0.315;
  const breath = 1 + Math.sin(now * 0.0022) * 0.045 * listeningMix;
  const radius = baseRadius * breath;
  const cosR = Math.cos(rotation);
  const sinR = Math.sin(rotation);

  // Scale for hi-DPI
  ctx.save();
  ctx.scale(2, 2);

  ctx.clearRect(0, 0, W, H);

  // Center glow
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.18);
  glow.addColorStop(0, `rgba(0,242,255,${0.095 + listeningMix * 0.045})`);
  glow.addColorStop(0.55, `rgba(0,182,205,${0.025 + listeningMix * 0.02})`);
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(cx - radius * 1.2, cy - radius * 1.2, radius * 2.4, radius * 2.4);

  // Project + sort
  const projected = points.map(p => {
    let scale = breath;
    if (stateMix > 0.001) {
      scale *= 1 + Math.sin(p.latitude * 10 - now * 0.006) * 0.095 * stateMix;
    }
    const px = p.x * scale;
    const pz = p.z * scale;
    return {
      x: px * cosR - pz * sinR,
      y: p.y * scale,
      z: px * sinR + pz * cosR,
    };
  });
  projected.sort((a, b) => a.z - b.z);

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const p of projected) {
    const perspective = 1 + p.z * 0.085;
    const x = cx + p.x * radius * perspective;
    const y = cy + p.y * radius * perspective;
    const depth = (p.z + 1.12) / 2.24;
    const pulse = 1 + Math.sin(now * 0.0022) * 0.28 * listeningMix;
    const size = (0.55 + depth * 1.18) * pulse;
    const alpha = (0.16 + depth * 0.78) * (0.86 + listeningMix * 0.14);
    const green = Math.round(220 + stateMix * 30);
    const blue  = Math.round(255 - stateMix * 48);
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(20,${green},${blue},${alpha})`;
    ctx.fill();
  }
  ctx.restore();

  // Electric arcs (responding)
  if (activeMode === "responding" && now - lastSpark > 155) {
    arcs.push({
      born: now,
      latitude: (Math.random() - 0.5) * Math.PI * 0.8,
      longitude: Math.random() * Math.PI * 2,
      seed: Math.random(),
    });
    arcs = arcs.slice(-7);
    lastSpark = now;
  }
  arcs = arcs.filter(a => now - a.born < 430);
  arcs.forEach(a => drawArc(a, now, radius, cx, cy, rotation));

  // Sonar ping (listening)
  if (activeMode === "listening") {
    const ping = (now * 0.00028) % 1;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * (1.08 + ping * 0.26), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,224,255,${(1 - ping) * 0.22})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.restore(); // undo scale(2,2)
  requestAnimationFrame(render);
}

requestAnimationFrame(render);

// ── Poll Flask server every 300ms ──────────────────────────────────────────
async function pollState() {
  try {
    const res = await fetch("http://localhost:5000/state");
    const data = await res.json();
    if (data.mode !== mode) {
      mode = data.mode;
      // sync buttons
      document.querySelectorAll(".mode-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.mode === mode);
      });
      applyUIMode(mode);
    }
  } catch (_) { /* server not up yet */ }
}
setInterval(pollState, 300);
</script>
</body>
</html>
